name: release

on:
  push:
    branches:
      - main
    paths:
      - package.json

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: Validate repository
    uses: ./.github/workflows/ci.yml

  version:
    name: Detect version change
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      full_sha: ${{ steps.version.outputs.full_sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect and validate version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current_version="$(node -p "require('./package.json').version")"

          if git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
            previous_version="$(git show "$BEFORE_SHA:package.json" | node -e "let input = ''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));")"
          else
            previous_version=""
          fi

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "The package version has not changed ($current_version); skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $current_version" >&2
            exit 1
          fi

          release_tag="v$current_version"
          if git rev-parse --verify --quiet "refs/tags/$release_tag"; then
            echo "The tag $release_tag already exists. Update package.json to a new version." >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

  publish-image:
    name: Publish Docker image
    needs:
      - ci
      - version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=sha-${{ needs.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.version.outputs.full_sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
